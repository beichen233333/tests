name: Build Android ARM64 SO

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-so-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-so:
    name: Build libastraeoffline.so
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then echo "Android SDK root was not set by setup-android" >&2; exit 1; fi
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Android ARM64 shared library
        shell: bash
        run: bash ./scripts/build_android_arm64.sh

      - name: Upload SO artifact
        uses: actions/upload-artifact@v4
        with:
          name: libastraeoffline-android-arm64-v8a-${{ github.ref_name }}
          path: |
            artifacts/android-arm64-v8a/libastraeoffline.so
            artifacts/android-arm64-v8a/libastraeoffline.so.debug
            artifacts/android-arm64-v8a/SHA256.txt
            artifacts/android-arm64-v8a/ELF_REPORT.txt
            artifacts/android-arm64-v8a/SIZE_REPORT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish SO to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/android-arm64-v8a/libastraeoffline.so
            artifacts/android-arm64-v8a/libastraeoffline.so.debug
            artifacts/android-arm64-v8a/SHA256.txt
            artifacts/android-arm64-v8a/ELF_REPORT.txt
            artifacts/android-arm64-v8a/SIZE_REPORT.txt
